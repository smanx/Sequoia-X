name: Build & Push Docker Image

# 触发方式：推送到 master 分支或 v* 标签时构建 Docker 镜像并推送到 GitHub (ghcr.io)
"on":
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# 需要向 GitHub Container Registry (ghcr.io) 推送镜像
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 容器仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        run: |
          set -euo pipefail
          # ghcr 镜像名必须全小写，仓库名如 smanx/Sequoia-X 需转小写
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="$IMG:latest,$IMG:sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAGS="$IMG:$GITHUB_REF_NAME,$TAGS"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 使用 GitHub Actions 缓存加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
