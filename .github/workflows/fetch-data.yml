name: Fetch Data & Push

# 触发方式：手动触发 + 每天中国时间 16:00（= UTC 08:00）定时触发
"on":
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

# 需要向 data 分支推送代码，授予 contents 写权限
permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    # baostock 从 GitHub 海外 runner 访问国内服务器较慢，首次回填会触发大量网络重试，
    # 90 分钟不够用。GitHub 托管 runner 单 job 上限 6 小时，这里放宽到上限。
    timeout-minutes: 360
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 恢复 data 分支历史数据
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            echo "发现 data 分支，尝试恢复历史数据..."
            git fetch origin data --depth 1
            # 匹配单文件（旧版）或分卷（sequoia_v2.tar.gz.aa/.ab/...）
            parts=$(git ls-tree -r --name-only origin/data data/ | grep -E '^data/sequoia_v2\.tar\.gz(\.[a-z]+)?$' || true)
            if [ -n "$parts" ]; then
              mkdir -p data
              : > data/sequoia_v2.tar.gz
              for p in $parts; do
                git show "origin/data:$p" >> data/sequoia_v2.tar.gz
              done
              tar -xzf data/sequoia_v2.tar.gz -C .
              rm -f data/sequoia_v2.tar.gz  # 只保留解压出的数据，避免下次压缩时嵌套旧压缩包
              echo "已拼接并解压 data 分支历史数据到本地 data 目录"
            else
              echo "data 分支上不存在 data/sequoia_v2.tar.gz 分卷，跳过恢复"
            fi
          else
            echo "data 分支不存在，跳过恢复"
          fi

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 uv 与依赖
        run: |
          pip install uv
          uv sync --frozen

      - name: 回填模式拉取数据（python main.py --backfill）
        # 最多跑 350 分钟：到点由 GitHub 主动停止该步骤进程树，
        # continue-on-error 让后续压缩/推送步骤照常执行（上传已有的、可能是部分的数据）
        timeout-minutes: 350
        continue-on-error: true
        env:
          # 备用占位，避免缺少 secret 时配置校验失败；如需飞书推送请在仓库 Secrets 配置 FEISHU_WEBHOOK_URL
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL || 'https://example.invalid/dummy' }}
        run: uv run python main.py --backfill

      - name: 校验数据文件并分卷压缩 data 目录
        run: |
          test -f data/sequoia_v2.db || { echo "data/sequoia_v2.db 不存在，终止"; exit 1; }
          mkdir -p "$RUNNER_TEMP/parts"
          # 分成不超过 50MB 的分卷，生成 sequoia_v2.tar.gz.aa/.ab/...
          tar -czf - -C . data | split -b 50m - "$RUNNER_TEMP/parts/sequoia_v2.tar.gz."
          ls -lh "$RUNNER_TEMP"/parts

      - name: 推送到 data 分支的 data 目录
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # data 分支存在则切换过去，否则创建空分支
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data --depth 1
            git checkout -B data origin/data
          else
            git checkout --orphan data
          fi

          # 清空工作区，只保留本次快照（各分卷均低于 100MB，可正常推送）
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p data
          cp "$RUNNER_TEMP"/parts/sequoia_v2.tar.gz.* data/
          # 清除回填阶段残留在工作区的裸 .db（data 分支无 .gitignore，git rm 不删未跟踪文件，
          # 否则裸库会随分卷一起被 add 提交，超出 GitHub 100MB 限制被拒）
          rm -f data/*.db

          git add data/sequoia_v2.tar.gz.*
          if git diff --cached --quiet; then
            echo "数据无变化，跳过推送"
          else
            git commit -m "chore(data): update data snapshot"
            git push origin data
          fi
