<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个股数据 | Sequoia-X</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c242e; --border:#2b3440;
    --text:#e6edf3; --muted:#8b96a3; --accent:#3b82f6; --accent2:#60a5fa;
    --good:#34d399; --bad:#f87171; --warn:#fbbf24;
    --radius:14px;
  }
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2f3a47;border-radius:999px}
  ::-webkit-scrollbar-thumb:hover{background:#3b82f6}
  *{scrollbar-width:thin;scrollbar-color:#2f3a47 transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background-image:radial-gradient(1200px 600px at 80% -10%,rgba(59,130,246,.12),transparent)}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 18px 70px}
  .top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .top h1{font-size:22px;margin:0}
  .top .code{color:var(--accent2);font-weight:600}
  a.back{color:var(--muted);text-decoration:none;font-size:13px}
  a.back:hover{color:var(--accent2)}
  .btn{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:9px;
    padding:9px 18px;cursor:pointer;font-weight:600;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
  .card-head{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card2);
    border-bottom:1px solid var(--border)}
  .card-head h2{font-size:14px;margin:0;flex:1}
  .status{font-size:12px;color:var(--muted)}
  .status.loading{color:var(--accent2)}
  .status.ok{color:var(--good)}
  .status.err{color:var(--bad)}
  .card-body{padding:8px 0}
  .card-body .none,.card-body .err{color:var(--muted);padding:14px 16px;font-size:13px}
  .card-body .err{color:var(--bad)}
  .tbl-wrap{overflow:auto;max-height:340px}
  table{border-collapse:collapse;font-size:12px;width:100%}
  th,td{white-space:nowrap;padding:5px 12px;border-bottom:1px solid var(--border);text-align:left;color:var(--text)}
  th{position:sticky;top:0;background:var(--card2);z-index:1;color:var(--muted);font-weight:600}
  tbody tr:hover{background:rgba(59,130,246,.07)}
  .fetch-all-row{margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="/">← 返回控制台</a>
    <h1><span id="name">个股</span> <span class="code" id="code">&nbsp;</span></h1>
    <span style="color:var(--muted);font-size:12px">数据来源：baostock</span>
  </div>
  <div class="fetch-all-row">
    <label class="asof-label" for="asOfDate">数据截止日期</label>
    <input type="date" id="asOfDate" title="数据截止日期：为空则取最新；填写则可查看该历史时点的数据，可与分析日期对齐">
    <button class="btn btn-primary" id="btnAll">获取全部数据</button>
    <button class="btn" id="btnXq">雪球 K 线</button>
    <button class="btn" id="btnCopy">一键复制所有数据</button>
    <span class="status" id="allStatus"></span>
  </div>
  <div id="cards"></div>
</div>

<script src="field_help.js"></script>
<script>
const KINDS=[
  {key:"dividend",title:"除权除息信息"},
  {key:"adjust_factor",title:"复权因子信息"},
  {key:"qfq",title:"本地计算前复权"},
  {key:"profit",title:"季频盈利能力"},
  {key:"operation",title:"季频营运能力"},
  {key:"growth",title:"季频成长能力"},
  {key:"balance",title:"季频偿债能力"},
  {key:"cashflow",title:"季频现金流量"},
  {key:"dupont",title:"季频杜邦指数"},
  {key:"express",title:"季频业绩快报"},
  {key:"forecast",title:"季频业绩预告"},
  {key:"basic",title:"证券基本资料"},
];
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const CODE=qs.get('code')||'', NAME=qs.get('name')||'';
const ASOF=qs.get('as_of')||'';
const DATA={};  // 已获取的数据项缓存：{ key: {fields, rows} }

// 每个卡片条目(数据源)的用途说明 —— 悬停在卡片标题上显示
const HELP={
  dividend:"上市公司分红送转明细：每股派息(税前/税后)、送股、转增股数及除权除息日、预案/实施公告日等。",
  adjust_factor:"复权因子序列：前复权因子(foreAdjustFactor)与后复权因子(backAdjustFactor)，用于把历史价格折算成前/后复权价，消除除权除息造成的价格跳变。",
  qfq:"本地计算前复权：取不复权收盘价 × 前复权因子，本地换算为前复权收盘价，使历史价格走势连续可比。",
  profit:"季频盈利能力：按季度披露的盈利指标，如净资产收益率、销售净利率、毛利率、净利润、每股收益等。",
  operation:"季频营运能力：按季度披露的营运效率，如应收账款/存货/流动资产/总资产周转率及周转天数。",
  growth:"季频成长能力：按季度披露的增长指标，如净资产、总资产、净利润、基本每股收益同比增长率。",
  balance:"季频偿债能力：按季度披露的偿债指标，如流动比率、速动比率、现金比率、资产负债率、产权比率。",
  cashflow:"季频现金流量：按季度披露的现金流量相关比例指标，衡量经营/投资/筹资活动产生的现金流与资产、负债、利润的关系。",
  dupont:"季频杜邦指数：用杜邦分析法把净资产收益率(ROE)拆解为盈利能力、营运效率与财务杠杆三大因素。",
  express:"季频业绩快报：按季度披露的业绩快报，含净利润、总资产、总股本、净资产收益率、每股收益等关键经营数据。",
  forecast:"季频业绩预告：按季度披露的业绩预告，含预告类型、净利润同比变动区间及业绩变动原因。",
  basic:"证券基本资料：个股基础信息，如证券代码、证券简称、上市日期、退市日期、证券类型与上市状态。",
};

async function jpost(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  return r.json();
}

function setStatus(which,html,cls){ const el=$('st_'+which); if(el){ el.innerHTML=html; el.className='status'+(cls?' '+cls:''); } }

function renderCard(def){
  const card=document.createElement('div'); card.className='card';
  card.id='card_'+def.key;
  card.innerHTML=`
    <div class="card-head">
      <h2 title="${HELP[def.key]||def.title}">${def.title}</h2>
      <span class="status" id="st_${def.key}">未请求</span>
      <button class="btn" data-fetch="${def.key}">获取</button>
    </div>
    <div class="card-body" id="bd_${def.key}"><div class="none">点击「获取」获取该数据项</div></div>`;
  $('cards').appendChild(card);
}

async function fetchKind(key, silent){
  setStatus(key,'<span class="mini-spin"></span>请求中…','loading');
  if(!silent){ $('allStatus').innerHTML=''; }
  try{
    const as_of=$('asOfDate').value||'';
    const r=await jpost('/api/stock/data',{code:CODE,kind:key,as_of});
    if(r.ok!==false && r.fields){
      setStatus(key,'成功','ok');
      $('bd_'+key).innerHTML=buildTable(r.fields,r.rows,key);
      DATA[key]={fields:r.fields, rows:r.rows};
      return true;
    }
    setStatus(key,'失败','err');
    $('bd_'+key).innerHTML=`<div class="err">${r.error||'查询失败'}</div>`;
    return false;
  }catch(e){
    setStatus(key,'失败','err');
    $('bd_'+key).innerHTML=`<div class="err">请求异常：${e.message}</div>`;
    return false;
  }
}

function buildTable(fields,rows,key){
  if(!rows || !rows.length){ return '<div class="none">（无数据）</div>'; }
  const fh=FIELD_HELP[key]||{};
  const head=fields.map(f=>`<th title="${fh[f]?`${f}：${fh[f]}`:`字段 ${f}（暂无说明）`}">${f}</th>`).join('');
  const body=rows.map(r=>`<tr>${r.map(c=>`<td>${c===''?'&nbsp;':c}</td>`).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function toXueqiuCode(s){
  // 纯数字代码(如 600000)或带 sh./sz. 前缀，转雪球 SH/SZ 格式
  let t=(s||' ').trim().toLowerCase();
  if(t.startsWith('sh.')) return 'SH'+t.slice(3);
  if(t.startsWith('sz.')) return 'SZ'+t.slice(3);
  t=t.replace(/\D/g,'');
  return (t.startsWith('6')?'SH':'SZ')+t;
}

// 生成复制文本：股票代码/名称 + 每个已获取数据项的表头(含字段说明)与数据行
function buildCopyText(){
  const lines=[`股票代码：${CODE}   股票名称：${NAME||''}`];
  KINDS.forEach(def=>{
    const d=DATA[def.key];
    if(!d) return;  // 未获取的项不复制
    const fh=FIELD_HELP[def.key]||{};
    lines.push('');
    lines.push(`【${def.title}】`);
    lines.push('列说明：');
    d.fields.forEach(f=>{
      lines.push(`  ${f}：${fh[f]||'(暂无说明)'}`);
    });
    lines.push('数据：');
    if(!d.rows || !d.rows.length){
      lines.push('  （无数据）');
    }else{
      d.rows.forEach(r=>lines.push('  '+r.join('\t')));
    }
  });
  return lines.join('\n');
}

async function copyAll(){
  const got=Object.keys(DATA).length;
  if(got===0){
    $('allStatus').textContent='请先获取至少一项数据';
    $('allStatus').className='status warn';
    return;
  }
  const text=buildCopyText();
  try{
    await navigator.clipboard.writeText(text);
    $('allStatus').textContent=`已复制 ${got} 项数据到剪贴板`;
    $('allStatus').className='status ok';
  }catch(e){
    // 降级：使用隐藏文本框复制
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); $('allStatus').textContent=`已复制 ${got} 项数据到剪贴板`; $('allStatus').className='status ok'; }
    catch(_e){ $('allStatus').textContent='复制失败：'+e.message; $('allStatus').className='status err'; }
    ta.remove();
  }
}

function init(){
  $('code').textContent=CODE;
  $('name').textContent=NAME||'个股';
  if(ASOF){ $('asOfDate').value=ASOF; }  // 从分析列表点入时预填数据截止日期
  $('btnXq').addEventListener('click',()=>{
    window.open('https://xueqiu.com/S/'+toXueqiuCode(CODE),'_blank');
  });
  $('btnCopy').addEventListener('click',copyAll);
  KINDS.forEach(renderCard);
  document.querySelectorAll('[data-fetch]').forEach(b=>{
    b.addEventListener('click',()=>fetchKind(b.getAttribute('data-fetch')));
  });
  $('btnAll').addEventListener('click',async ()=>{
    $('btnAll').disabled=true; $('allStatus').textContent='正在获取全部数据…'; $('allStatus').className='status';
    let done=0, ok=0;
    for(const def of KINDS){
      const success=await fetchKind(def.key, true);
      done++; if(success) ok++;
      $('allStatus').textContent=`已获取 ${done}/${KINDS.length}（成功 ${ok}）…`;
    }
    $('btnAll').disabled=false;
    $('allStatus').textContent=`全部完成：成功 ${ok}/${KINDS.length}`;
    $('allStatus').className='status'+(ok===KINDS.length?' ok':' err');
  });
}
init();
</script>
</body>
</html>
